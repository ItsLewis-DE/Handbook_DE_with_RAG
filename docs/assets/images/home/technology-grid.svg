  <!-- Dashed Coordinate Grid Lines -->
  <g stroke="#5f7e78" stroke-width="0.8" stroke-dasharray="3 3" opacity="0.28">
    <!-- Vertical line with gap for reticle [138, 162] -->
    <line x1="150" y1="0" x2="150" y2="138"/>
    <line x1="150" y1="162" x2="150" y2="300"/>
    <!-- Horizontal line with gap for reticle [138, 162] -->
    <line x1="0" y1="150" x2="138" y2="150"/>
    <line x1="162" y1="150" x2="300" y2="150"/>
  </g>

  <!-- Technical Reticle / Crosshair at (150, 150) -->
  <g stroke="#ed6840" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
    <!-- Center ring -->
    <circle cx="150" cy="150" r="4.5" fill="none"/>
    <!-- Crosshair ticks -->
    <line x1="150" y1="140" x2="150" y2="144"/>
    <line x1="150" y1="156" x2="150" y2="160"/>
    <line x1="140" y1="150" x2="144" y2="150"/>
    <line x1="156" y1="150" x2="160" y2="150"/>
