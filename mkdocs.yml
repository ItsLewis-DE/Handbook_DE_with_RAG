site_name: Behind the Pipeline
site_description: Cẩm nang Data Engineering bằng tiếng Việt — kiến trúc hệ thống, database internals và chatbot RAG hỗ trợ đọc tài liệu.
site_url: https://itslewis-de.github.io/behind-the-pipeline/
repo_url: https://github.com/ItsLewis-DE/behind-the-pipeline
repo_name: ItsLewis-DE/behind-the-pipeline

theme:
  name: material
  custom_dir: overrides
  language: vi
  logo: assets/images/brand/behind-the-pipeline-logo.svg
  favicon: assets/images/brand/behind-the-pipeline-favicon.svg
  font: false
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Data Architecture:
      - Shared-disk vs shared-nothing: architecture/shared-disk-vs-shared-nothing.md
  - Database Internals:
      - Phân cấp & Lưu trữ PostgreSQL: postgres/postgres.md
      - Index trong cơ sở dữ liệu: index/index.md
  - Apache Airflow:
      - Architecture: airflow/architecture.md
  - Apache Spark:
      - Overview: spark/overview.md
      - Khi nào nên dùng Spark?: spark/when-to-use.md
      - Kiến trúc Spark: spark/architecture.md
      - RDD, DataFrame và Dataset: spark/data-abstractions.md
      - Execution Model: spark/execution-model.md
      - Query Planning: spark/query-planning.md
      - Partitioning và Shuffle: spark/partition-shuffle.md
      - Memory và Fault Tolerance: spark/memory-fault-tolerance.md
      - Deployment: spark/deployment.md
      - Performance: spark/performance.md
      - Structured Streaming: spark/structured-streaming.md

markdown_extensions:
  - toc:
      toc_depth: 2-4
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/fonts.css
  - stylesheets/brand.css
  - stylesheets/landing.css
  - stylesheets/article.css
  - stylesheets/technology-background.css
  - stylesheets/marquee.css
  - stylesheets/chat.css

extra_javascript:
  - javascripts/lottie.min.js
  - javascripts/article-deck.js
  - javascripts/author-dialog.js
  - javascripts/chat.js
