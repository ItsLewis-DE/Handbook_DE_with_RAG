site_name: Behind the Pipeline
site_description: Pipeline RAG — chatbot hỏi đáp tài liệu Data Engineering bằng tiếng Việt, kết hợp tìm kiếm hybrid, mô hình ngôn ngữ local và trích dẫn nguồn.
site_url: https://itslewis-de.github.io/Handbook_DE_with_RAG/
repo_url: https://github.com/ItsLewis-DE/Handbook_DE_with_RAG
repo_name: ItsLewis-DE/Handbook_DE_with_RAG

theme:
  name: material
  custom_dir: overrides
  language: vi
  logo: assets/images/brand/behind-the-pipeline-logo-inverse.svg
  favicon: assets/images/brand/behind-the-pipeline-favicon.svg
  font: false
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Thư viện: library.md
  - Data Architecture:
      - Data Lake, Data Warehouse và Data Mart: ware_lake_lw/doc.md
      - "Data Lake, Data Warehouse, and Data Mart (English)": ware_lake_lw/doc.en.md
  - Database Internals:
      - "PostgreSQL (phần 1): Phân cấp, tiến trình và bộ nhớ": postgres/postgres.md
      - "PostgreSQL (phần 2): Truy vấn, lưu trữ và phục hồi": postgres/p2.md
      - "PostgreSQL (Part 1): Hierarchy, Processes, and Memory (English)": postgres/postgres.en.md
      - "PostgreSQL (Part 2): Query Processing, Storage, and Recovery (English)": postgres/p2.en.md
      - Index trong cơ sở dữ liệu: index/index.md
      - Indexes in Databases (English): index/index.en.md
  - Orchestration:
      - Apache Airflow: airflow/architecture.md
      - Apache Airflow (English): airflow/architecture.en.md
  - Distributed Computing:
      - Apache Spark (phần 1): spark/archi.md
      - Kiến trúc Apache Spark (phần 2): spark/p2.md
      - "Apache Spark (Part 1): Architecture and Execution (English)": spark/archi.en.md
      - "Apache Spark (Part 2): Joins, RDD, and Memory (English)": spark/p2.en.md

hooks:
  - hooks/reading_languages.py

extra:
  article_translations:
    lake-warehouse-mart:
      vi: ware_lake_lw/doc.md
      en: ware_lake_lw/doc.en.md
    airflow-architecture:
      vi: airflow/architecture.md
      en: airflow/architecture.en.md
    postgres-processes:
      vi: postgres/postgres.md
      en: postgres/postgres.en.md
    postgres-storage:
      vi: postgres/p2.md
      en: postgres/p2.en.md
    database-index:
      vi: index/index.md
      en: index/index.en.md
    spark-architecture:
      vi: spark/archi.md
      en: spark/archi.en.md
    spark-execution-memory:
      vi: spark/p2.md
      en: spark/p2.en.md

markdown_extensions:
  - attr_list
  - toc:
      toc_depth: 2-4
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/reading-language.css
  - stylesheets/fonts.css
  - stylesheets/brand.css
  - stylesheets/landing.css
  - stylesheets/article.css
  - stylesheets/technology-background.css
  - stylesheets/marquee.css
  - stylesheets/library.css
  - stylesheets/chat.css

extra_javascript:
  - javascripts/reading-language.js
  - javascripts/mobile-navigation.js
  - javascripts/lottie.min.js
  - javascripts/article-deck.js
  - javascripts/author-dialog.js
  - javascripts/chat.js
