site_name: Behind the Pipeline
site_description: Pipeline RAG — chatbot hỏi đáp tài liệu Data Engineering bằng tiếng Việt, kết hợp tìm kiếm hybrid, mô hình ngôn ngữ local và trích dẫn nguồn.
site_url: https://itslewis-de.github.io/Handbook_DE_with_RAG/
repo_url: https://github.com/ItsLewis-DE/Handbook_DE_with_RAG
repo_name: ItsLewis-DE/Handbook_DE_with_RAG

theme:
  name: material
  custom_dir: overrides
  language: vi
  logo: assets/images/brand/behind-the-pipeline-logo.svg
  favicon: assets/images/brand/behind-the-pipeline-favicon.svg
  font: false
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Data Architecture:
      - Shared-disk vs shared-nothing: architecture/shared-disk-vs-shared-nothing.md
  - Database Internals:
      - Phân cấp & Lưu trữ PostgreSQL: postgres/postgres.md
      - Index trong cơ sở dữ liệu: index/index.md
  - Apache Airflow:
      - Architecture: airflow/architecture.md

markdown_extensions:
  - toc:
      toc_depth: 2-4
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/fonts.css
  - stylesheets/brand.css
  - stylesheets/landing.css
  - stylesheets/article.css
  - stylesheets/technology-background.css
  - stylesheets/marquee.css
  - stylesheets/chat.css

extra_javascript:
  - javascripts/mobile-navigation.js
  - javascripts/lottie.min.js
  - javascripts/article-deck.js
  - javascripts/author-dialog.js
  - javascripts/chat.js
