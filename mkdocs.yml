site_name: Behind the Pipeline
site_description: Đi vào phía sau những hệ thống và pipeline dữ liệu

theme:
  name: material
  language: vi
  logo: assets/images/behind-the-pipeline-logo.svg
  favicon: assets/images/behind-the-pipeline-favicon.svg
  font:
    text: Manrope
    code: IBM Plex Mono
  palette:
    primary: indigo
    accent: deep purple
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.follow

nav:
  - Home: index.md
  - Data Architecture:
      - Shared-disk vs shared-nothing: architecture/shared-disk-vs-shared-nothing.md
  - Database Internals:
      - Phân cấp & Lưu trữ PostgreSQL: postgres/postgres.md
      - Index trong cơ sở dữ liệu: index/index.md
  - Apache Airflow:
      - Architecture: airflow/architecture.md

markdown_extensions:
  - toc:
      toc_depth: 2-4
  - tables
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/brand.css
  - stylesheets/landing.css
  - stylesheets/article.css
  - stylesheets/technology-background.css

extra_javascript:
  - javascripts/article-deck.js
