{% extends "base.html" %}

{% block extrahead %}
  {{ super() }}
  {% for edition in (page.meta.get('reading_languages', []) if page else []) %}
    <link rel="alternate" hreflang="{{ edition.lang }}" href="{{ config.site_url }}{{ edition.url }}">
  {% endfor %}
{% endblock %}

{% block content %}
  {% if page %}{% include "partials/reading-language.html" %}{% endif %}
  {{ super() }}
{% endblock %}
